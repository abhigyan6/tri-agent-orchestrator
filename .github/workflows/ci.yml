name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest no longer provides Python 3.9 through setup-python.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dry-run every workflow (no agent CLIs required)
        run: |
          for wf in relay debate audit; do
            python bin/tri-agent run --workflow "$wf" --prompt "CI smoke test" --dry-run
          done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          bash -n init-repo.sh
          bash -n scripts/install-skill.sh
